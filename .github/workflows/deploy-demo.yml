name: Deploy prototype demo

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare prototype only
        run: |
          mkdir -p "$RUNNER_TEMP/demo-site"
          cp prototype/index.html prototype/*.css prototype/*.js "$RUNNER_TEMP/demo-site/"
          cp -R prototype/assets prototype/resources "$RUNNER_TEMP/demo-site/"
          find "$RUNNER_TEMP/demo-site" -type f -name '*.md' -delete
          touch "$RUNNER_TEMP/demo-site/.nojekyll"
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/demo-site
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
